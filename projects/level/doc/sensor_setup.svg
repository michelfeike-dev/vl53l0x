<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Aufbau der Sensor-Matrix</title>
  <desc>Vier Sensoren an den Ecken eines Rechtecks von 2x mal 2y, Ursprung in der Mitte. S1 (x | y), S2 (-x | y), S3 (-x | -y), S4 (x | -y).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="360" fill="#fff"/>

  <rect x="190" y="83.75" width="300" height="202.5" fill="none" stroke="#000" stroke-width="1"/>

  <line x1="340" y1="185" x2="410" y2="185" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="340" y1="185" x2="340" y2="125" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="418" y="189" font-size="13" fill="#000">x</text>
  <text x="346" y="124" font-size="13" fill="#000">y</text>
  <circle cx="340" cy="185" r="2.5" fill="#000"/>
  <text x="340" y="208" font-size="12" fill="#000" text-anchor="middle">(0 | 0)</text>

  <circle cx="490" cy="83.75" r="7" fill="#fff" stroke="#000" stroke-width="1.2"/>
  <circle cx="190" cy="83.75" r="7" fill="#fff" stroke="#000" stroke-width="1.2"/>
  <circle cx="190" cy="286.25" r="7" fill="#fff" stroke="#000" stroke-width="1.2"/>
  <circle cx="490" cy="286.25" r="7" fill="#fff" stroke="#000" stroke-width="1.2"/>

  <text x="500" y="70" font-size="14" font-weight="bold" fill="#000">S1  (x | y)</text>
  <text x="180" y="70" font-size="14" font-weight="bold" fill="#000" text-anchor="end">S2  (−x | y)</text>
  <text x="180" y="310" font-size="14" font-weight="bold" fill="#000" text-anchor="end">S3  (−x | −y)</text>
  <text x="500" y="310" font-size="14" font-weight="bold" fill="#000">S4  (x | −y)</text>

  <line x1="190" y1="320" x2="490" y2="320" stroke="#000" stroke-width="0.8"/>
  <line x1="190" y1="314" x2="190" y2="326" stroke="#000" stroke-width="0.8"/>
  <line x1="490" y1="314" x2="490" y2="326" stroke="#000" stroke-width="0.8"/>
  <text x="340" y="340" font-size="12" fill="#000" text-anchor="middle">2x</text>

  <line x1="525" y1="92" x2="525" y2="278" stroke="#000" stroke-width="0.8"/>
  <line x1="519" y1="92" x2="531" y2="92" stroke="#000" stroke-width="0.8"/>
  <line x1="519" y1="278" x2="531" y2="278" stroke="#000" stroke-width="0.8"/>
  <text x="536" y="189" font-size="12" fill="#000">2y</text>

</svg>
