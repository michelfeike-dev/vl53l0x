<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Tilt angle from two distance readings</title>
  <desc>Side view: two sensors 60 mm apart measure different distances to a tilted surface. The distance difference delta d and the sensor spacing L form a right triangle with the tilt angle theta, tan theta = delta d / L.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="330" fill="#fff"/>

  <rect x="160" y="42" width="360" height="8" fill="#fff" stroke="#000" stroke-width="1"/>
  <rect x="212" y="50" width="16" height="6" fill="#fff" stroke="#000" stroke-width="1"/>
  <rect x="452" y="50" width="16" height="6" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="340" y="32" font-size="13" fill="#000" text-anchor="middle">Sensor board</text>

  <line x1="160" y1="315" x2="520" y2="105" stroke="#000" stroke-width="2"/>

  <line x1="220" y1="58" x2="220" y2="274" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="460" y1="58" x2="460" y2="134" stroke="#000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <line x1="220" y1="280" x2="460" y2="280" stroke="#000" stroke-width="0.8" stroke-dasharray="4 3"/>
  <line x1="460" y1="280" x2="460" y2="142" stroke="#000" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="340" y="300" font-size="15" fill="#000" text-anchor="middle">L</text>
  <text x="470" y="215" font-size="15" fill="#000">Δd</text>

  <path d="M262 280 A42 42 0 0 0 256.3 258.8" fill="none" stroke="#000" stroke-width="1"/>
  <text x="270" y="272" font-size="15" fill="#000">θ</text>

</svg>
